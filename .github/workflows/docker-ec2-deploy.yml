name: Build and Deploy (Image Transfer)

on:
  push:
    branches: [main, secondary-]
    paths:
      - .github/workflows/docker-ec2-deploy.yml
      - backend/**
      - web/**
      - docker-compose.ec2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend in CI
        working-directory: web
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Build backend image
        run: docker build -t salon-backend:latest -f backend/Dockerfile backend

      - name: Build frontend image
        run: docker build -t salon-frontend:latest -f web/Dockerfile web

      - name: Save image bundle
        run: docker save salon-backend:latest salon-frontend:latest | gzip > salon-images.tar.gz

      - name: Upload image bundle and compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "salon-images.tar.gz,docker-compose.ec2.yml"
          target: "/tmp/salon-deploy"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - name: Load images and deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            SRC_DIR="/tmp/salon-deploy"

            mkdir -p "$APP_DIR"

            BUNDLE=$(find "$SRC_DIR" -name "salon-images.tar.gz" -type f | head -1)
            COMPOSE=$(find "$SRC_DIR" -name "docker-compose.ec2.yml" -type f | head -1)

            [ -n "$BUNDLE" ] || { echo "Missing salon-images.tar.gz"; exit 1; }
            [ -n "$COMPOSE" ] || { echo "Missing docker-compose.ec2.yml"; exit 1; }
            [ -f "$APP_DIR/.env" ] || { echo "Missing $APP_DIR/.env"; exit 1; }

            cp -f "$COMPOSE" "$APP_DIR/docker-compose.ec2.yml"

            gunzip -c "$BUNDLE" | docker load

            docker compose --project-directory "$APP_DIR" -f "$APP_DIR/docker-compose.ec2.yml" --env-file "$APP_DIR/.env" up -d --remove-orphans

            FRONTEND_PORT=$(grep -E '^FRONTEND_PORT=' "$APP_DIR/.env" | tail -n 1 | cut -d'=' -f2 | tr -d '\r' || true)
            [ -n "$FRONTEND_PORT" ] || FRONTEND_PORT=8088

            HEALTH_OK=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://localhost:${FRONTEND_PORT}/api/health" >/tmp/salon-health.json 2>/dev/null; then
                HEALTH_OK=1
                cat /tmp/salon-health.json
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "ERROR: health check failed on port ${FRONTEND_PORT}"
              docker compose --project-directory "$APP_DIR" -f "$APP_DIR/docker-compose.ec2.yml" ps || true
              docker compose --project-directory "$APP_DIR" -f "$APP_DIR/docker-compose.ec2.yml" logs --tail=120 backend frontend || true
              exit 1
            fi

            rm -rf "$SRC_DIR"
            docker image prune -f
