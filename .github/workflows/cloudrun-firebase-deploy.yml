name: Deploy – Cloud Run + Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - web/**
      - firebase.json
      - .github/workflows/cloudrun-firebase-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ruwan-salon
  REGION: asia-south1
  SERVICE: backend-service
  REPOSITORY: backend-images
  IMAGE: asia-south1-docker.pkg.dev/ruwan-salon/backend-images/backend-service

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Backend → Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & push Docker image
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy new revision to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --add-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:salon-pg \
            --quiet

      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "Cloud Run URL: $URL"
          curl -fsS --max-time 15 "$URL/api/health"

  # ─── Frontend ────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend → Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project ruwan-salon --non-interactive
